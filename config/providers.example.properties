# 默认使用火山方舟 Agent Plan，密钥从环境读取。
default-provider=ark
providers.ark.base-url=https://ark.cn-beijing.volces.com/api/plan/v3
# 需在自己的控制台确认可用模型标识；此处沿用用户目标模型。
providers.ark.model=deepseek-v4.1-flash
providers.ark.api-key-env=ARK_API_KEY
providers.ark.timeout-seconds=60
providers.ark.max-output-tokens=2048

# 其他 OpenAI Chat Completions 兼容服务可按相同结构扩展。
# 所有地址必须为账户实际授权端点，不自动回退到按量计费接口。
providers.custom.base-url=https://example.com/v1
providers.custom.model=replace-with-account-model
providers.custom.api-key-env=CUSTOM_API_KEY
providers.custom.timeout-seconds=60
providers.custom.max-output-tokens=2048
